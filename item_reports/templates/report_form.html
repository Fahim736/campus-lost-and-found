{% extends 'base.html' %}

{% block content %}

<h1>{{ title }}</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Report
    </button>

</form>

<br>

<a href="{% url 'reports' %}">
    Cancel
</a>

{% endblock %}
