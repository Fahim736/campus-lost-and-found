{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm bg-white">
    {% if project.image %}
        <img src="{{ project.image.url }}" class="img-fluid rounded mb-4" style="max-height: 400px; object-fit: cover;" alt="{{ project.title }}">
    {% endif %}

    <h2 class="fw-bold">{{ project.title }}</h2>
    <p class="text-muted"><strong>Technologies:</strong> <span class="badge bg-info text-dark">{{ project.technology_used }}</span></p>
    <hr>
    
    <h5>Project Description:</h5>
    <p class="lh-lg">{{ project.description }}</p>

    <div class="mt-4 d-flex gap-2">
        {% if project.github_link %}
            <a href="{{ project.github_link }}" target="_blank" class="btn btn-dark">
                View on GitHub
            </a>
        {% endif %}
        <a href="{% url 'projects_list' %}" class="btn btn-secondary">Back to Projects</a>
    </div>
</div>
{% endblock %}
